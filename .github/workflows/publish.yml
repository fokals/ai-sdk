name: publish

# A GitHub release stages that version on npm. npm trusts this workflow directly (trusted
# publishing), so no npm token is stored anywhere. A staged version goes live once the owner
# approves it on npmjs.com with his security key (npm's recommended setting: the trusted
# publisher may stage, not publish).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@fokals/ai-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm stage publish . --access public --provenance
