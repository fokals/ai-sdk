name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: is the package still written from the API as it is today?
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    # The tools are written from the live OpenAPI document; this fails when it has moved on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/generate.mjs
      - run: git diff --exit-code src/generated.ts
